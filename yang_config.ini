[audio]
# 采样率 (Hz)
sample=48000
# 声道数 (1=单声道, 2=立体声)
channel=2
# 音频比特率 (kbps)
bitrate=128
# 启用单声道 (注意: 未被解析器读取, 实际键名为 enableMono)
usingMono=0
# 启用回声消除 (注意: 未被解析器读取, 实际键名为 enableAec)
hasAec=1
# AEC 回声路径长度 (帧)
echoPath=10
# AEC 缓冲帧数
aecBufferFrames=8
# 音频播放类型 (0=默认)
audioPlayType=0
# 音频编码器 (0=AAC,1=MP3,2=SPEEX,3=OPUS,4=PCMA,5=PCMU)
audioEncoderType=3
# 音频解码器 (0=AAC,1=MP3,2=SPEEX,3=OPUS,4=PCMA,5=PCMU)
audioDecoderType=3
# 音频编码缓存帧数
audioCacheNum=100
# 音频缓存大小
audioCacheSize=100
# 音频播放缓存帧数
audioPlayCacheNum=10
# 音频采集设备索引 (-1=默认设备)
aIndex=-1
# 音频子设备索引
aSubIndex=0

[video]
# 画面宽度 (像素)
width=640
# 画面高度 (像素)
height=480
# 输出宽度 (像素)
outWidth=640
# 输出高度 (像素)
outHeight=480
# 视频码率 (kbps)
rate=2048
# 帧率 (fps)
frame=30
# 视频编码缓存帧数
videoCacheNum=50
# 编码器输入缓存帧数
evideoCacheNum=50
# 视频播放缓存帧数
videoPlayCacheNum=5
# 编码输出色彩空间 (0=YUY2,1=I420,2=YV12,3=NV12,4=NV21,5=RGB,6=ARGB,7=BGRA)
videoEncoderFormat=0
# 采集色彩空间 (0=YUY2,1=I420,2=YV12,3=NV12,4=NV21,5=RGB,6=ARGB,7=BGRA)
videoCaptureFormat=0
# 视频编码器 (0=H264,1=H265,2=AV1,3=VP8,4=VP9,5=MJPEG)
videoEncoderType=0
# 视频解码器 (0=H264,1=H265,2=AV1,3=VP8,4=VP9,5=MJPEG)
videoDecoderType=0
# 编码硬件加速 (0=软件,1=Intel,2=Nvidia,3=Android)
videoEncHwType=0
# 解码硬件加速 (0=软件,1=Intel,2=Nvidia,3=Android)
videoDecHwType=0
# 视频采集设备索引
vIndex=0

[rtc]
# 启用 DataChannel (注意: 未被解析器读取)
usingDatachannel=0
# 使用本地IP作为ICE候选 (注意: 未被解析器读取)
iceUsingLocalIp=0
# 本地IP地址 (注意: 未被解析器读取)
iceLocalIP=192.168.1.102
# ICE候选类型 (0=Host,1=STUN,2=TURN)
iceCandidateType=0
# ICE/TURN 服务器端口
iceServerPort=3478
# ICE/TURN 服务器IP
iceServerIP=10.42.0.1
# ICE 服务器用户名
iceUserName=metartc
# ICE 服务器密码
icePassword=metartc
# RTC 套接字协议 (0=UDP,1=TCP)
rtcSocketProtocol=0
# TURN 套接字协议 (0=UDP,1=TCP)
turnSocketProtocol=0
# 信令服务器端口
rtcPort=1985
# 本地RTC绑定端口
rtcLocalPort=16000
# RTC服务器IP (注意: 未被解析器读取, 实际键名为 iceServerIP)
rtcServerIP=10.42.0.1


[sys]
# IP协议族 (0=IPv4,1=IPv6)
familyType=0
# 启用日志文件 (0=关闭,1=开启)
enableLogFile=1
# HTTP端口
httpPort=1988
# 日志级别 (1-5, 数值越大越详细)
logLevel=5

[enc]
# 编码器预设值
preset=3
